base_url: "https://mangabuff.ru"
reader:
  url_add_history: "/addHistory?r=702"
  update_interval_days: 1

  parsing:
    url_catalog:       "/manga"
    url_chapters:      "/manga/{translit_name}"
    url_chapters_load: "/chapters/load"
    url_candy_claim:   "/halloween/takeCandy?r=822"
    reward_selector:   ".reward-item"
    reward_type_attr:  "data-reward-type"
    reward_id_attr:    "data-reward-id"

  reward_slots:
    - name:             "card"
      daily_limit:      10
      interval_seconds: 3600
      reward_keys:      ["id", "name", "image"]
      max_chapters_per_slot: 30

    - name:             "scroll"
      daily_limit:      5
      interval_seconds: 1800
      reward_keys:      ["scroll_id"]
      max_chapters_per_slot: 10

    - name:             "candy"
      daily_limit:      35
      interval_seconds: 180
      reward_keys:      ["token", "type"]
      max_chapters_per_slot: 70

  reading_modes:
    standard:
      slots:               ["card", "scroll"]
      fallback_interval_s: 5400

    event:
      slots:               ["candy", "card", "scroll"]
      fallback_interval_s: 5400

    test:
      slots:               ["candy"]
      fallback_interval_s: 5400

  default_mode: "standard"

daily:
  url_balance:        "/balance"
  url_ping:           "/visit/ping"
  url_calendar_claim: "/balance/claim/{}"
  item_selector:      ".daily-rewards .daily-rewards-item"
  claim_text:         "Забрать"
  day_attr:           "data-day"

quiz:
  mode:         "daily"
  answer_limit: 10
  answer_delay: 12

mining:
  delay: 2.0

# ── Плавний запуск акаунтів ──────────────────────────────────────────────
startup:
  connect_delay: 5.0        # пауза між connect() двох акаунтів (сек)
  connect_timeout: 30.0     # таймаут одного connect()
  skip_failed: true         # пропустити збійний акаунт, не зупиняти старт всього сервісу
  connect_retries: 3        # спроб connect() ОДНОГО акаунта перед тим, як здатись
  retry_backoff: 5.0        # пауза між спробами connect() того самого акаунта (сек)

# ── Фонове відновлення акаунтів після старту (ReconnectWatchdog) ─────────
reconnect:
  interval: 60.0            # як часто перевіряти чергу ERROR-акаунтів (сек)
  base_backoff: 60.0        # пауза перед першою повторною спробою на акаунт
  max_backoff: 900.0        # стеля backoff (15 хв)
  backoff_multiplier: 2.0
